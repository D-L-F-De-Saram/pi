# Include inside the HTTPS virtual host serving dev.desaram.ai.
location ^~ /agent/artifacts/ {
    if ($request_method != GET) {
        return 405;
    }

    # Use the HTTPS origin directly. Its public DNS path loops at Cloudflare.
    proxy_pass https://89.167.101.222/agent/artifacts/;
    proxy_ssl_server_name on;
    proxy_ssl_name dev.desaram.com;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;

    # The path and query authenticate the download. Keep LibreChat credentials
    # and other browser headers out of the upstream request.
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Host dev.desaram.com;
    proxy_set_header Connection "";
    proxy_set_header Content-Length "";

    proxy_cache off;
    proxy_buffering off;
    proxy_redirect off;
    proxy_intercept_errors off;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    add_header Referrer-Policy "no-referrer" always;

    # The signed URL is a bearer credential.
    access_log off;
}
