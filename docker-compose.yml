services:
  junior-de-saram:
    build: .
    image: junior-de-saram:local
    container_name: junior-de-saram
    env_file: .env
    environment:
      JUNIOR_DE_SARAM_LOG_ROOT: /data/logs
    ports:
      - "127.0.0.1:8160:8160"
    volumes:
      - junior_de_saram_sessions:/data/sessions
      - junior_de_saram_workspaces:/data/workspaces
      - junior_de_saram_artifacts:/data/artifacts
      - ./junior-de-saram/logs:/data/logs
    networks:
      - librechat
    restart: unless-stopped
volumes:
  junior_de_saram_sessions:
  junior_de_saram_workspaces:
  junior_de_saram_artifacts:
networks:
  librechat:
    external: true
    name: librechat_default
